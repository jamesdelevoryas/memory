#cloud-config
# First-boot setup for the memory server VM. The binary itself is built and
# installed by deploy.sh. The data lives on a volume whose ext4 filesystem is
# labeled memory-data; it's mounted at /var/lib/memory whenever it's attached
# (nofail: the machine still boots without it, and the service then refuses
# to start rather than run on an empty directory). The server has no public
# address: create it on the private network only, behind the edge, which
# proxies HTTPS to it and NATs its outbound traffic.
package_update: true
package_upgrade: true
packages:
  - build-essential
  - pkg-config
  - rsync
  - ufw
  - sqlite3
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - gnupg
users:
  - default
  - name: memory
    system: true
    shell: /usr/sbin/nologin
    no_create_home: true
mounts:
  - [LABEL=memory-data, /var/lib/memory, ext4, "defaults,nofail,discard", "0", "2"]
bootcmd:
  # Hetzner gives a private-only server no default route and no DNS: send
  # its traffic through the network gateway to the edge's NAT.
  - ip route replace default via 10.0.0.1
  - mkdir -p /etc/systemd/resolved.conf.d && printf '[Resolve]\nDNS=185.12.64.1 185.12.64.2\n' > /etc/systemd/resolved.conf.d/hetzner.conf && systemctl restart systemd-resolved
runcmd:
  # Rust toolchain for building on the box.
  - curl -sSf https://sh.rustup.rs | HOME=/root sh -s -- -y --profile minimal
  - ufw allow OpenSSH && ufw allow from 10.0.0.0/16 to any port 8750 proto tcp && ufw --force enable
  - install -d -o root -g memory -m 0750 /etc/memory
  # The memory user's uid can differ from the machine that wrote the volume.
  - if mountpoint -q /var/lib/memory; then chown memory:memory /var/lib/memory && chmod 0700 /var/lib/memory && find /var/lib/memory -mindepth 1 -maxdepth 1 ! -name lost+found -exec chown -R memory:memory {} +; fi
